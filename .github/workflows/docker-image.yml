name: Docker builder image

# 构建编译镜像（Rust + mingw + cargo-deb 等）并推送到 GHCR：
#   ghcr.io/hadyliu/iot-power-builder:latest
# 仅 Dockerfile 变化、手动触发或每周定时时才重建；PR 只构建不推送。
on:
  push:
    branches: [main]
    paths:
      - "packaging/docker/Dockerfile"
      - ".github/workflows/docker-image.yml"
  pull_request:
    paths:
      - "packaging/docker/Dockerfile"
      - ".github/workflows/docker-image.yml"
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/hadyliu/iot-power-builder

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: packaging/docker
          file: packaging/docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
